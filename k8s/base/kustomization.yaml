# Base comum a todos os ambientes. Os overlays (local, production) só
# declaram o que muda: tag das imagens, réplicas mínimas, banco e exposição.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pedidos-veloz

labels:
  - pairs:
      app.kubernetes.io/part-of: pedidos-veloz
      app.kubernetes.io/managed-by: kustomize
    includeTemplates: true   # também nos pods (usado por NetworkPolicy e ServiceMonitor)

resources:
  - namespace.yaml
  - configmap.yaml
  - gateway.yaml
  - orders.yaml
  - inventory.yaml
  - payments.yaml
  - network-policies.yaml
