# Serviço de Estoque: mesmo padrão de orders.yaml (ver comentários lá).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  labels: { app.kubernetes.io/name: inventory, app.kubernetes.io/component: backend }
spec:
  # Sem `replicas`: quem decide é o HPA (evita brigar com ele a cada apply).
  revisionHistoryLimit: 5            # permite `kubectl rollout undo`
  selector:
    matchLabels: { app.kubernetes.io/name: inventory }
  # Rolling update sem perda de capacidade: sobe 1 pod novo, espera ficar
  # Ready (readinessProbe) e só então derruba 1 antigo.
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  minReadySeconds: 5
  template:
    metadata:
      labels: { app.kubernetes.io/name: inventory, app.kubernetes.io/component: backend }
    spec:
      automountServiceAccountToken: false   # o app não fala com a API do Kubernetes
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      # Espalha as réplicas entre nós: a queda de um nó não derruba o serviço.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: inventory }
      containers:
        - name: inventory
          image: pedidos-veloz/inventory   # tag definida pelo overlay (kustomize images)
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: app-config }
          env:
            - { name: OTEL_SERVICE_NAME, value: inventory }
            - { name: PGDATABASE, value: inventory }
            - { name: PGUSER, value: inventory }
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: pedidos-veloz-db, key: inventory-password }
          resources:
            requests: { cpu: 100m, memory: 128Mi }   # base para o HPA calcular % de CPU
            limits: { cpu: 500m, memory: 256Mi }
          # startup: dá tempo para a migração inicial sem a liveness matar o pod.
          startupProbe:
            httpGet: { path: /healthz/live, port: http }
            periodSeconds: 2
            failureThreshold: 30
          # readiness: só recebe tráfego se o banco responde.
          readinessProbe:
            httpGet: { path: /healthz/ready, port: http }
            periodSeconds: 5
            failureThreshold: 2
          # liveness: só reinicia se o processo travou (não depende do banco).
          livenessProbe:
            httpGet: { path: /healthz/live, port: http }
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: inventory
  labels: { app.kubernetes.io/name: inventory }
spec:
  selector: { app.kubernetes.io/name: inventory }
  ports:
    - { name: http, port: 80, targetPort: http }
---
# Escala horizontal pela CPU. Sobe rápido (pico da campanha) e desce devagar
# (evita "flapping" quando o tráfego oscila).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: inventory
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: inventory }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - { type: Percent, value: 100, periodSeconds: 30 }
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - { type: Pods, value: 1, periodSeconds: 60 }
---
# Durante manutenção de nós (drain), mantém ao menos 1 pod no ar.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: inventory
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: inventory }
