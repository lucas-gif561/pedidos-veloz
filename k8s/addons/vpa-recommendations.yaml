# VPA em modo "Off" (só recomendação). Exige o Vertical Pod Autoscaler no cluster.
#
# Por que não deixar o VPA aplicar sozinho? O HPA já escala esses Deployments
# pela CPU. Se o VPA também mudasse o request de CPU, os dois brigariam: o
# HPA mede utilização em relação ao request. Então:
#   - HPA decide QUANTAS réplicas (reage ao pico de tráfego)
#   - VPA (Off) sugere QUAL request/limit usar; o time revisa e ajusta no Git
#
#   kubectl apply -f k8s/addons/vpa-recommendations.yaml
#   kubectl describe vpa -n pedidos-veloz orders
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata: { name: gateway, namespace: pedidos-veloz }
spec:
  targetRef: { apiVersion: apps/v1, kind: Deployment, name: gateway }
  updatePolicy: { updateMode: "Off" }
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata: { name: orders, namespace: pedidos-veloz }
spec:
  targetRef: { apiVersion: apps/v1, kind: Deployment, name: orders }
  updatePolicy: { updateMode: "Off" }
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata: { name: inventory, namespace: pedidos-veloz }
spec:
  targetRef: { apiVersion: apps/v1, kind: Deployment, name: inventory }
  updatePolicy: { updateMode: "Off" }
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata: { name: payments, namespace: pedidos-veloz }
spec:
  targetRef: { apiVersion: apps/v1, kind: Deployment, name: payments }
  updatePolicy: { updateMode: "Off" }
